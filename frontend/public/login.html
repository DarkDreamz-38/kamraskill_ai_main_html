<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KarmaSkill AI — Sign In</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/karmaskill.css">
  <style>
    body {
      background: linear-gradient(165deg, #0b1f5e 0%, #001453 60%, #001040 100%);
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      font-family: "Noto Sans", sans-serif;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 24px 64px rgba(0, 8, 40, 0.45);
      padding: 2.25rem 2rem 1.75rem;
    }

    /* ---------- Brand ---------- */
    .brand { text-align: center; margin-bottom: 1.5rem; }
    .brand-badge {
      width: 58px; height: 58px;
      margin: 0 auto 1.1rem;
      background: var(--primary);
      border-radius: 15px;
      display: flex; align-items: center; justify-content: center;
      color: #ffffff;
      font-size: 1.3rem; font-weight: 800; letter-spacing: 0.02em;
      box-shadow: 0 6px 16px rgba(0, 40, 142, 0.35);
    }
    .brand-title {
      font-family: 'Noto Sans', sans-serif;
      font-size: 1.65rem; font-weight: 800; color: #0f1f4b;
      letter-spacing: -0.01em; text-transform: none;
    }
    .brand-sub {
      font-size: 0.9rem; color: #6b7280; margin-top: 4px;
      font-weight: 400; text-transform: none; letter-spacing: 0;
    }

    /* ---------- Form ---------- */
    .form { display: flex; flex-direction: column; gap: 1rem; }
    .field label {
      display: block;
      font-size: 0.85rem; font-weight: 700; color: #101a3d;
      margin-bottom: 6px;
    }
    .field label .opt { font-weight: 600; color: #8a94a8; }
    .input {
      width: 100%;
      padding: 0.8rem 0.95rem;
      background: #ffffff;
      border: 1px solid #d8dce8;
      border-radius: 9px;
      font-size: 0.925rem;
      color: var(--on-surface);
      font-family: inherit;
      transition: border 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .input.filled-tint {
      background: #e9eefb;
      border-color: #dfe5f6;
    }
    .input:focus {
      outline: none;
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(0, 40, 142, 0.14);
    }
    .input::placeholder { color: #9aa3b5; }

    /* ---------- Role picker ---------- */
    .roles {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    }
    .role {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 14px 6px 12px;
      background: #ffffff;
      border: 1.5px solid #e2e6f0;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.825rem; font-weight: 600; color: #1f2937;
      transition: all 0.13s ease;
    }
    .role svg { width: 24px; height: 24px; color: #4a5568; transition: color 0.13s ease; }
    .role:hover { border-color: #c3cbe4; background: #f8faff; }
    .role.selected {
      background: var(--primary-fixed);
      border-color: var(--primary);
      color: var(--on-primary-fixed);
      box-shadow: 0 2px 8px rgba(0, 40, 142, 0.12);
    }
    .role.selected svg { color: var(--primary); }

    /* ---------- Error ---------- */
    .error {
      background: var(--error-container);
      border: 1px solid var(--error);
      color: var(--on-surface);
      border-radius: 9px;
      padding: 0.7rem 0.85rem;
      font-size: 13px;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .error.hide { display: none; }
    .error strong { color: var(--error); }

    /* ---------- Submit ---------- */
    .submit {
      width: 100%;
      padding: 0.85rem;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem; font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      box-shadow: 0 4px 12px rgba(0, 20, 83, 0.25);
    }
    .submit:hover { background: var(--on-primary-fixed-variant); }
    .submit:active { transform: translateY(1px); }
    .submit:disabled { opacity: 0.55; cursor: not-allowed; }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* ---------- Hint & footer ---------- */
    .hint {
      margin-top: 0.9rem;
      background: #f1f5fd;
      border: 1px solid #dfe7f8;
      border-radius: 8px;
      padding: 0.55rem 0.75rem;
      font-size: 12px; color: #33415c;
      text-align: center;
    }
    .hint code {
      background: #ffffff;
      border: 1px solid #dbe3f4;
      border-radius: 4px;
      padding: 0 4px;
      font-size: 12px;
      color: var(--on-primary-fixed);
      font-weight: 600;
    }
    .policy {
      margin-top: 1.1rem;
      font-size: 12px; color: #8a92a6;
      line-height: 1.55;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-badge">KS</div>
      <div class="brand-title">KarmaSkill AI</div>
      <div class="brand-sub">Public Sector Competency &amp; Learning Portal</div>
    </div>

    <form class="form" id="loginForm" novalidate>
      <div class="error hide" id="errorBox">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--error);flex-shrink:0;">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 8v4M12 16h.01"/>
        </svg>
        <span id="errorText"></span>
      </div>

      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" class="input" type="text" autocomplete="name" placeholder="RV">
      </div>

      <div class="field">
        <label for="cadreId">Cadre / Officer ID <span class="opt">(optional)</span></label>
        <input id="cadreId" class="input filled-tint" type="text" autocomplete="username" placeholder="123">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" class="input" type="password" autocomplete="current-password" placeholder="Enter your password">
      </div>

      <div class="field">
        <label>Select your role</label>
        <div class="roles" id="roles">
          <button type="button" class="role selected" data-role="employee">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2.5"/><circle cx="12" cy="9" r="2.4"/><path d="M8 16.5c.8-1.8 2.3-2.7 4-2.7s3.2.9 4 2.7"/><path d="M8.5 6h1.5M14 6h1.5"/></svg>
            Employee
          </button>
          <button type="button" class="role" data-role="admin">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><path d="M12 3l7 3v5c0 4.6-3 8.4-7 9.5C8 19.4 5 15.6 5 11V6l7-3z"/><path d="M9.2 11.6l2 2 3.6-3.8"/></svg>
            Admin
          </button>
          <button type="button" class="role" data-role="trainer">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><path d="M2.5 9.5L12 5l9.5 4.5L12 14 2.5 9.5z"/><path d="M6.5 11.5v4.2c0 1.2 2.5 2.6 5.5 2.6s5.5-1.4 5.5-2.6v-4.2"/><path d="M21 10v5"/></svg>
            Trainer
          </button>
        </div>
      </div>

      <button class="submit" id="submitBtn" type="submit">
        <span id="submitLabel">Sign in to dashboard</span>
      </button>

      <div class="hint">
        Prototype access — Login ID <code>nexus123</code> · Password <code>1234</code>
      </div>

      <p class="policy">
        By continuing you agree to the department's acceptable use
        policy. Session data is stored locally on this device.
      </p>
    </form>
  </div>

  <script src="/js/app.js"></script>
  <script>
    (function () {
      'use strict';
      var form = document.getElementById('loginForm');
      var submitBtn = document.getElementById('submitBtn');
      var errorBox = document.getElementById('errorBox');
      var errorText = document.getElementById('errorText');

      var DEMO_ID = 'nexus123';
      var DEMO_PASSWORD = '1234';
      var selectedRole = 'employee';

      // Already signed in? Go straight to the dashboard.
      if (localStorage.getItem('karmaskill_token') && localStorage.getItem('karmaskill_employee')) {
        location.replace('/index.html');
      }

      /* ---------- Role picker ---------- */
      document.getElementById('roles').addEventListener('click', function (e) {
        var btn = e.target.closest('.role');
        if (!btn) return;
        document.querySelectorAll('.role').forEach(function (r) { r.classList.remove('selected'); });
        btn.classList.add('selected');
        selectedRole = btn.getAttribute('data-role');
      });

      /* ---------- Helpers ---------- */
      function setLoading(on) {
        submitBtn.disabled = on;
        submitBtn.innerHTML = on
          ? '<div class="spinner"></div>'
          : '<span id="submitLabel">Sign in to dashboard</span>';
      }

      function showError(msg) {
        errorText.innerHTML = '<strong>Sign-in failed:</strong> ' + msg;
        errorBox.classList.remove('hide');
      }

      function hideError() {
        errorBox.classList.add('hide');
      }

      function finishLogin(data, fullName) {
        localStorage.setItem('karmaskill_token', data.token);
        localStorage.setItem('karmaskill_employee', JSON.stringify(data.employee));
        localStorage.setItem('karmaskill_role', selectedRole);
        location.href = '/index.html';
      }

      /* ---------- Submit ---------- */
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        hideError();

        var fullName = document.getElementById('fullName').value.trim();
        var cadreId = document.getElementById('cadreId').value.trim();
        var pw = document.getElementById('password').value;

        if (!fullName && !cadreId) {
          showError('Please enter your full name or Officer ID.');
          return;
        }
        if (!pw) {
          showError('Please enter your password.');
          return;
        }

        // The Officer ID doubles as the login ID; fall back to the name field.
        var loginId = cadreId || fullName;

        setLoading(true);

        fetch(KarmaApp.API + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: loginId, password: pw })
        }).then(function (res) {
          return res.json().then(function (data) {
            if (!res.ok) throw new Error(data.detail || 'Invalid ID or password.');
            return data;
          });
        }).catch(function (backendErr) {
          // Backend offline fallback: allow the demo account so the
          // portal stays usable during prototype demos.
          if (loginId === DEMO_ID && pw === DEMO_PASSWORD) {
            return {
              token: 'demo-token-offline',
              employee: {
                id: 1,
                name: fullName || 'Demo Officer',
                email: 'nexus123@karmaskill.gov.in',
                department: 'Department of Personnel & Training',
                role: 'Senior Officer',
                experience: 6
              }
            };
          }
          throw (backendErr instanceof Error && backendErr.message
            ? backendErr
            : new Error('Invalid ID or password.'));
        }).then(function (data) {
          finishLogin(data, fullName);
        }).catch(function (err) {
          showError(err.message || 'Login failed. Please try again.');
          setLoading(false);
        });
      });
    })();
  </script>
</body>
</html>
